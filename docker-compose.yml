services:
  socialswarm:
    # Build locally from this fork's Dockerfile.
    # The upstream MiroFish image (ghcr.io/666ghj/mirofish) does not include
    # SocialSwarm fork features (multi-platform, news feed, archetypes, etc.),
    # so we build from source rather than pulling a binary.
    build: .
    container_name: socialswarm
    env_file:
      - .env
    ports:
      - "3000:3000"
      - "5001:5001"
    restart: unless-stopped
    volumes:
      - ./backend/uploads:/app/backend/uploads